name: RTL8191SU driver build test

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev dwarves git python3

      - name: Download Linux kernel
        run: |
          git clone --depth 1 --branch linux-6.18.y https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git linux

      - name: Download RTL8191SU driver
        run: |
          git clone --depth 1 https://github.com/chunkeey/rtl8192su.git rtl8192su

      - name: Disable RTL8192SE
        run: |
          find rtl8192su -name 'Makefile' -type f -exec sed -i \
            -E 's/(CONFIG_RTL8192SE[[:space:]]*[:?+]?=)[[:space:]]*m/\1n/g' {} +
          sed -i '/rtl8192se/d' rtl8192su/rtlwifi/Makefile

      - name: Prepare kernel
        run: |
          cd linux
          make x86_64_defconfig
          make olddefconfig
          make -j2 modules_prepare

      - name: Fix Linux 6.18 compatibility
        run: |
          find rtl8192su/rtlwifi -type f \( -name '*.c' -o -name '*.h' \) -exec sed -i \
            -e 's/sta->ht_cap/sta->deflink.ht_cap/g' \
            -e 's/sta->supp_rates/sta->deflink.supp_rates/g' \
            -e 's/sta->bandwidth/sta->deflink.bandwidth/g' \
            -e 's/sta->vht_cap/sta->deflink.vht_cap/g' \
            -e 's/__kernel_time_t/long/g' {} +

      - name: Fix timer API
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          base = Path("rtl8192su/rtlwifi/base.c")
          header = Path("rtl8192su/rtlwifi/base.h")

          s = base.read_text()
          h = header.read_text()

          if "#include <linux/timer.h>" not in s:
              match = re.search(r"^#include\s", s, re.MULTILINE)
              if not match:
                  raise SystemExit("ERROR: include section not found in base.c")
              s = s[:match.start()] + "#include <linux/timer.h>\n" + s[match.start():]

          h = re.sub(
              r"(void\s+rtl_watch_dog_timer_callback)\s*\(\s*unsigned long\s+\w+\s*\)\s*;",
              r"\1(struct timer_list *timer);",
              h
          )
          h = re.sub(
              r"(void\s+rtl_easy_concurrent_retrytimer_callback)\s*\(\s*unsigned long\s+\w+\s*\)\s*;",
              r"\1(struct timer_list *timer);",
              h
          )

          s = re.sub(
              r"(void\s+rtl_watch_dog_timer_callback)\s*\(\s*unsigned long\s+\w+\s*\)",
              r"\1(struct timer_list *timer)",
              s
          )
          s = re.sub(
              r"(void\s+rtl_easy_concurrent_retrytimer_callback)\s*\(\s*unsigned long\s+\w+\s*\)",
              r"\1(struct timer_list *timer)",
              s
          )

          old = re.compile(
              r"struct ieee80211_hw\s+\*hw\s*=\s*\(struct ieee80211_hw\s*\*\)\w+\s*;\s*"
              r"struct rtl_priv\s+\*rtlpriv\s*=\s*rtl_priv\(hw\)\s*;"
          )

          new_watchdog = (
              "struct rtl_priv *rtlpriv = from_timer(rtlpriv, timer, works.watchdog_timer);\n"
              "\tstruct ieee80211_hw *hw = rtlpriv->works.hw;"
          )
          new_retry = (
              "struct rtl_priv *rtlpriv = from_timer(rtlpriv, timer, works.dualmac_easyconcurrent_retrytimer);\n"
              "\tstruct ieee80211_hw *hw = rtlpriv->works.hw;"
          )

          s, count1 = old.subn(new_watchdog, s, count=1)
          s, count2 = old.subn(new_retry, s, count=1)

          if count1 != 1 or count2 != 1:
              raise SystemExit(
                  f"ERROR: callback conversion failed: watchdog={count1}, retry={count2}"
              )

          base.write_text(s)
          header.write_text(h)

          for name, content in [("base.c", s), ("base.h", h)]:
              if re.search(
                  r"rtl_(?:watch_dog_timer|easy_concurrent_retrytimer)_callback\s*\(\s*unsigned long",
                  content
              ):
                  raise SystemExit(f"ERROR: old timer declaration remains in {name}")

          if "#include <linux/timer.h>" not in s:
              raise SystemExit("ERROR: timer.h missing")

          if s.count("from_timer(") < 2:
              raise SystemExit("ERROR: timer callbacks were not converted")

          print("Timer API compatibility fixes applied successfully")
          PY

      - name: Fix mac80211 compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("rtl8192su/rtlwifi/rtl8192su/trx.c")
          s = p.read_text()

          s = s.replace(
              "rx_status->flag |= RX_FLAG_40MHZ;",
              "rx_status->bw = RATE_INFO_BW_40;"
          )
          s = s.replace(
              "rx_status->flag |= RX_FLAG_HT;",
              "rx_status->encoding = RX_ENC_HT;"
          )
          s = s.replace(
              "ieee80211_beacon_get_template(hw, mac->vif, &offs)",
              "ieee80211_beacon_get_template(hw, mac->vif, &offs, 0)"
          )

          p.write_text(s)
          PY

      - name: Build driver
        run: |
          make -C rtl8192su KSRC="$GITHUB_WORKSPACE/linux" V=1

      - name: Upload build files
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rtl8191su-build
          path: |
            rtl8192su/**/*.ko
            rtl8192su/**/*.o
