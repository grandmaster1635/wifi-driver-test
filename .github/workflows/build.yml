name: RTL8191SU driver build test

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev dwarves git python3

      - name: Download Linux kernel
        run: |
          git clone --depth 1 --branch linux-6.18.y https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git linux

      - name: Download RTL8191SU driver
        run: |
          git clone --depth 1 https://github.com/chunkeey/rtl8192su.git rtl8192su

      - name: Disable RTL8192SE
        run: |
          find rtl8192su -name 'Makefile' -type f -exec sed -i \
            -E 's/(CONFIG_RTL8192SE[[:space:]]*[:?+]?=)[[:space:]]*m/\1n/g' {} +
          sed -i '/rtl8192se/d' rtl8192su/rtlwifi/Makefile

      - name: Prepare kernel
        run: |
          cd linux
          make x86_64_defconfig
          make olddefconfig
          make -j2 modules_prepare

      - name: Fix Linux 6.18 compatibility
        run: |
          find rtl8192su/rtlwifi -type f \( -name '*.c' -o -name '*.h' \) -exec sed -i \
            -e 's/sta->ht_cap/sta->deflink.ht_cap/g' \
            -e 's/sta->supp_rates/sta->deflink.supp_rates/g' \
            -e 's/sta->bandwidth/sta->deflink.bandwidth/g' \
            -e 's/sta->vht_cap/sta->deflink.vht_cap/g' \
            -e 's/__kernel_time_t/long/g' {} +

      - name: Fix timer API
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("rtl8192su/rtlwifi")

          for p in list(root.rglob("*.c")) + list(root.rglob("*.h")):
              s = p.read_text(errors="ignore")
              s = s.replace(
                  "rtl_watch_dog_timer_callback(unsigned long data)",
                  "rtl_watch_dog_timer_callback(struct timer_list *timer)"
              )
              s = s.replace(
                  "rtl_easy_concurrent_retrytimer_callback(unsigned long data)",
                  "rtl_easy_concurrent_retrytimer_callback(struct timer_list *timer)"
              )
              p.write_text(s)

          p = root / "base.c"
          s = p.read_text()

          s = re.sub(
              r'setup_timer\(&rtlpriv->works\.watchdog_timer,\s*'
              r'rtl_watch_dog_timer_callback,\s*\(unsigned long\)hw\);',
              'timer_setup(&rtlpriv->works.watchdog_timer, '
              'rtl_watch_dog_timer_callback, 0);',
              s
          )

          s = re.sub(
              r'setup_timer\(&rtlpriv->works\.dualmac_easyconcurrent_retrytimer,\s*'
              r'rtl_easy_concurrent_retrytimer_callback,\s*\(unsigned long\)hw\);',
              'timer_setup(&rtlpriv->works.dualmac_easyconcurrent_retrytimer, '
              'rtl_easy_concurrent_retrytimer_callback, 0);',
              s
          )

          s = s.replace(
              'struct ieee80211_hw *hw = (struct ieee80211_hw *)data;\n'
              '\tstruct rtl_priv *rtlpriv = rtl_priv(hw);',
              'struct rtl_priv *rtlpriv = from_timer(rtlpriv, timer, '
              'works.watchdog_timer);',
              1
          )

          s = s.replace(
              'struct ieee80211_hw *hw = (struct ieee80211_hw *)data;\n'
              '\tstruct rtl_priv *rtlpriv = rtl_priv(hw);',
              'struct rtl_priv *rtlpriv = from_timer(rtlpriv, timer, '
              'works.dualmac_easyconcurrent_retrytimer);',
              1
          )

          p.write_text(s)
          PY

          sed -i '1i#include <linux/timer.h>' rtl8192su/rtlwifi/base.c

          echo "Checking timer header:"
          head -n 3 rtl8192su/rtlwifi/base.c
          grep -n "timer_setup\|from_timer" rtl8192su/rtlwifi/base.c

      - name: Fix mac80211 compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("rtl8192su/rtlwifi/rtl8192su/trx.c")
          s = p.read_text()

          s = s.replace(
              "rx_status->flag |= RX_FLAG_40MHZ;",
              "rx_status->bw = RATE_INFO_BW_40;"
          )
          s = s.replace(
              "rx_status->flag |= RX_FLAG_HT;",
              "rx_status->encoding = RX_ENC_HT;"
          )
          s = s.replace(
              "ieee80211_beacon_get_template(hw, mac->vif, &offs)",
              "ieee80211_beacon_get_template(hw, mac->vif, &offs, 0)"
          )

          p.write_text(s)
          PY

      - name: Build driver
        run: |
          make -C rtl8192su KSRC="$GITHUB_WORKSPACE/linux" V=1

      - name: Upload build files
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rtl8191su-build
          path: |
            rtl8192su/**/*.ko
            rtl8192su/**/*.o
