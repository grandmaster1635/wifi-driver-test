name: RTL8191SU driver build test

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev dwarves git

      - name: Download Linux 6.18.58
        run: |
          git clone --depth 1 --branch v6.18.58 https://github.com/torvalds/linux.git linux

      - name: Download RTL8191SU driver
        run: |
          git clone --depth 1 https://github.com/chunkeey/rtl8192su.git rtl8192su

      - name: Prepare kernel
        run: |
          cd linux
          make x86_64_defconfig
          make olddefconfig
          make -j2 modules_prepare

      - name: Fix compatibility with Linux 6.18
        run: |
          find rtl8192su/rtlwifi -type f \( -name '*.c' -o -name '*.h' \) -exec sed -i \
            -e 's/sta->ht_cap/sta->deflink.ht_cap/g' \
            -e 's/sta->supp_rates/sta->deflink.supp_rates/g' \
            -e 's/sta->bandwidth/sta->deflink.bandwidth/g' {} +

      - name: Fix legacy time type
        run: |
          sed -i 's/__kernel_time_t/long/g' rtl8192su/rtlwifi/wifi.h

      - name: Build driver
        run: |
          make -C rtl8192su KSRC="$GITHUB_WORKSPACE/linux" V=1

      - name: Upload driver modules
        uses: actions/upload-artifact@v4
        with:
          name: rtl8191su-modules
          path: rtl8192su/rtlwifi/**/*.ko
